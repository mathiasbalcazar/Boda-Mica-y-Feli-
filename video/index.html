<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El tráiler · Micaela & Felipe · 18.12.2027</title>
<meta name="description" content="El tráiler oficial (y nada serio) de la boda de Micaela & Felipe, 18 de diciembre de 2027.">
<meta property="og:title" content="El tráiler · Micaela & Felipe">
<meta property="og:description" content="Un evento nunca antes visto. 18.12.2027.">
<meta property="og:image" content="poster.jpg">
<meta name="theme-color" content="#14181B">
<link rel="icon" type="image/png" href="../img/logo-azul.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{--fondo:#14181B;--tinta:#F3EFE6;--suave:#A9B4BA;--amarillo:#FFE14D;--azul:#A9C3D0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100svh;background:radial-gradient(ellipse at 50% 0%, #2A3238 0%, var(--fondo) 60%);color:var(--tinta);font-family:'Montserrat',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:calc(28px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));text-align:center}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--suave)}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(40px,11vw,68px);line-height:1;letter-spacing:.02em;margin:10px 0 4px;
    text-shadow:0 4px 0 #000}
  h1 span{color:var(--amarillo)}
  .nombres{font-family:'Great Vibes',cursive;font-size:clamp(34px,8vw,46px);color:var(--azul);margin-bottom:22px}
  .pantalla{width:min(420px,100%);aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#000;
    box-shadow:0 0 0 6px #22292E,0 0 0 7px #39434A,0 30px 60px rgba(0,0,0,.55)}
  video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
  .botones{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
  .boton{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    text-decoration:none;font-weight:600;color:var(--tinta);border:1px solid #4A555C;transition:background .25s,color .25s,border-color .25s}
  .boton:hover{border-color:var(--tinta)}
  .boton.solido{background:var(--amarillo);border-color:var(--amarillo);color:#14181B}
  .boton.solido:hover{background:#fff;border-color:#fff}
  .nota{margin-top:26px;font-size:12px;color:var(--suave);max-width:380px;line-height:1.7}
</style>
</head>
<body>
  <p class="eyebrow">Estreno exclusivo</p>
  <h1>EL <span>TRÁILER</span></h1>
  <p class="nombres">Micaela &amp; Felipe</p>

  <div class="pantalla">
    <video controls playsinline preload="metadata" poster="poster.jpg">
      <source src="invitacion-meme.mp4" type="video/mp4">
    </video>
  </div>

  <div class="botones">
    <a class="boton solido" href="../">💌 Abrir la invitación</a>
    <a class="boton" href="invitacion-meme.mp4" download="Invitacion meme Mica y Feli.mp4">⬇ Descargar</a>
  </div>
  <p class="nota">18 · 12 · 2027 — Sube el volumen. Lugar y hora, muy pronto.</p>
</body>
</html>
